<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="tbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#00D2FF"/>
    </linearGradient>
    <filter id="tbGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Rounded Squircle Background -->
  <rect width="64" height="64" rx="16" fill="url(#tbGrad)"/>
  
  <!-- Stylized Zap / Energy Symbol -->
  <g filter="url(#tbGlow)" fill="#FFFFFF">
    <polygon points="35 6 12 36 32 36 29 58 52 28 32 28 35 6"/>
  </g>
</svg>
